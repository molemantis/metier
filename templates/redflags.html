<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/metier-icon-small.svg" />
  <title>Common Red Flags · Metier</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#eef0f2;--surface:#fff;--border:#cdd1d4;--text:#0c2340;--muted:#6b7682;
      --accent:#0c2340;--accent-h:#081a30;--accent-bg:#eef1f4;--accent-bd:#c4c6c8;
      --away:#991b1b;
      --r:12px;--sh:0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg);color:var(--text);min-height:100vh;padding:28px 16px 80px;line-height:1.6}
    .page{max-width:660px;margin:0 auto}

    /* Shared header */
    .hdr{text-align:center;margin-bottom:24px}
    .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:10px}
    .logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;
               display:flex;align-items:center;justify-content:center;font-size:1.1rem;
               box-shadow:0 2px 8px rgba(12,35,64,.35)}
    .logo-name{font-size:1.65rem;font-weight:800;letter-spacing:-.5px}
    .logo-name span{color:var(--accent)}
    .brand{display:inline-block;margin-bottom:12px}
    .brand-img{height:94px;width:auto;display:block}
    .hdr-nav{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
    .nav-link{font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:none;
              padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .14s}
    .nav-link:hover{color:var(--accent);background:var(--accent-bg)}
    .nav-link.active{color:var(--accent);background:var(--accent-bg);font-weight:700}

    .intro{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
           padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh)}
    .intro h1{font-size:1.15rem;font-weight:800;margin-bottom:6px;line-height:1.3}
    .intro p{font-size:.86rem;color:var(--muted);line-height:1.6}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
          overflow:hidden;box-shadow:var(--sh)}
    .rf-group{padding:14px 20px;border-bottom:1px solid var(--border)}
    .rf-group:last-child{border-bottom:none}
    .rf-group-hd{display:flex;align-items:center;gap:9px;font-size:.92rem;font-weight:800;color:var(--text);margin-bottom:7px}
    .rf-icon{font-size:1.1rem;flex-shrink:0}
    .rf-bullets{list-style:none;display:flex;flex-direction:column;gap:6px;padding-left:30px}
    .rf-bullets li{font-size:.83rem;line-height:1.5;color:var(--muted);display:flex;gap:8px}
    .rf-bullets li::before{content:"•";color:var(--away);font-weight:800;flex-shrink:0}
  </style>
</head>
<body>
<div class="page">

  <header class="hdr">
    <a href="/" class="brand"><img src="/assets/metier-logo.svg" alt="Metier" class="brand-img"/></a>
    <nav class="hdr-nav">
      <a href="/" class="nav-link">🔍 Analyzer</a>
      <a href="/history" class="nav-link">📋 Job Tracker</a>
      <a href="/questions" class="nav-link">✏️ Questions to Ask</a>
      <a href="/redflags" class="nav-link active">🚩 Red Flags</a>
    </nav>
  </header>

  <div class="intro">
    <h1>Common red flags Métier checks for</h1>
    <p>These are the patterns Métier scans every message against behind the scenes. Know them, and you'll start spotting trouble yourself — before you ever reply.</p>
  </div>

  <div class="card" id="rfList"></div>
</div>

<script>
  const RED_FLAGS = [
    { icon:"💰", title:"Money asked of you", items:[
      "Any fee — training, equipment, background checks, certifications, deposits.",
      "Legit recruiters are paid by the employer. A real candidate never pays to get hired."]},
    { icon:"🪪", title:"Personal info too early", items:[
      "SSN, bank/routing numbers, passport, driver's license, or date of birth before a signed offer.",
      "Requests to “verify your identity” with ID photos just to get started."]},
    { icon:"👻", title:"Ghost-job signals", items:[
      "Vague role with no named team, manager, or department.",
      "Not listed on the company's own careers page.",
      "“We'll keep your resume on file” with no actual opening."]},
    { icon:"🎭", title:"Identity & impersonation", items:[
      "Recruiter's LinkedIn doesn't match their claim — wrong industry, or showing “Open to Work.”",
      "Email domain doesn't match the company, or is a lookalike (a missing or swapped letter).",
      "Brand-new email domain registered days before they reached out.",
      "A senior title at a big company (“VP Talent Acquisition at Allstate”) paired with a personal Gmail/Yahoo — real execs use the company domain.",
      "Leftover template placeholders — a Canva default site like reallygreatsite.com, example.com, or “[First Name]” — means it was mass-produced and never finished.",
      "The signature contradicts itself — e.g. “VP at the company” up top, “independent contract recruiter” in the bio.",
      "An AI-generated or stock-photo headshot — too-perfect skin, odd background, or a face that shows up elsewhere on a reverse image search.",
      "A barely-there LinkedIn profile — very few connections, no posts or activity, and recently created."]},
    { icon:"🎩", title:"Executive-search red flags", items:[
      "Claims a known search firm (Korn Ferry, Heidrick, Russell Reynolds…) but the email domain or LinkedIn doesn't match the firm.",
      "Not listed on the firm's own team / consultant bios page.",
      "Hides behind “confidential client” to dodge every verification question — real retained search explains confidentiality, it doesn't weaponize it.",
      "A vague, rushed cold message for a senior role — genuine retained recruiters lead with specifics and move deliberately."]},
    { icon:"⚡", title:"Pressure & urgency", items:[
      "“Respond today,” “limited spots,” or rushing you before you can verify anything.",
      "An offer made with no real interview."]},
    { icon:"📱", title:"Off-channel push", items:[
      "Moving you to WhatsApp, Telegram, or personal text right away.",
      "Text/chat only — never a real phone or video conversation."]},
    { icon:"🎥", title:"Fake interview process", items:[
      "The whole “interview” happens over chat (Teams text, Telegram, Signal) — never a live call.",
      "They keep their camera off, or dodge any video meeting where you'd see their face.",
      "You're offered the job with no real interview, or hired the same day you were contacted."]},
    { icon:"🤖", title:"Automated, AI-written & resume harvesting", items:[
      "Generic, polished-but-hollow text that praises you without naming a single real detail from your background — classic AI/template outreach.",
      "Leftover template fields or the wrong role, stack, or seniority — a mass blast that wasn't even proofread.",
      "The first real ask is your resume, full contact info, or to “complete your profile” on an outside portal — the role is just bait to collect data.",
      "Scripted follow-ups on a timer (“just bumping this,” “last chance”) that keep escalating the request for information.",
      "“Flattery” that just quotes your public LinkedIn back at you (titles, posts, skills) — a scraper does that in seconds. It's not genuine interest, so don't let it lower your guard.",
      "Note: real recruiters use templates and AI too — it's the AI feel PLUS vagueness or data-collection that's the tell."]},
    { icon:"🌐", title:"Thin digital footprint", items:[
      "No company website, or a LinkedIn page with one or two “employees.”",
      "No web presence for the recruiter or the company at all."]},
    { icon:"💸", title:"Too good to be true", items:[
      "Salary well above market for the role and your experience.",
      "“Guaranteed placement” or an offer that lands without any real process."]},
  ];

  document.getElementById('rfList').innerHTML = RED_FLAGS.map(g=>`
    <div class="rf-group">
      <div class="rf-group-hd"><span class="rf-icon">${g.icon}</span>${g.title}</div>
      <ul class="rf-bullets">${g.items.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>`).join('');
</script>
</body>
</html>
