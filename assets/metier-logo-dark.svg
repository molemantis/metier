<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="tailD" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#9a9da0" stop-opacity="0"/>
      <stop offset="55%" stop-color="#b5b8ba" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#eef0f1" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glowD" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#aeb2b5"/>
      <stop offset="100%" stop-color="#3a546f"/>
    </radialGradient>
  </defs>

  <rect width="320" height="80" fill="#0c2340"/>

  <!-- ── Meteor icon ── -->
  <g transform="translate(6,4)">
    <path d="M58 8 L30 44 L40 50 Z" fill="url(#tailD)"/>
    <path d="M52 6 L31 40 L37 44 Z" fill="#eef0f1" opacity="0.45"/>
    <circle cx="54" cy="14" r="1.6" fill="#d4d6d8" opacity="0.85"/>
    <circle cx="60" cy="20" r="1.1" fill="#b5b8ba" opacity="0.6"/>
    <circle cx="50" cy="9"  r="1.0" fill="#fff" opacity="0.8"/>
    <circle cx="30" cy="46" r="18" fill="#aeb2b5" opacity="0.2"/>
    <circle cx="30" cy="46" r="12" fill="url(#glowD)" stroke="#c4c6c8" stroke-width="1.3"/>
    <circle cx="30" cy="46" r="6.5" fill="none" stroke="#eef0f1" stroke-width="1.1" opacity="0.5"/>
    <circle cx="30" cy="46" r="3" fill="#ffffff"/>
    <circle cx="26" cy="42" r="2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- ── Wordmark ── -->
  <text x="80" y="48"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="40" font-weight="800" letter-spacing="-1">
    <tspan fill="#eef0f1">Me</tspan><tspan fill="#b5b8ba">tier</tspan>
  </text>

  <!-- Tagline -->
  <text x="81" y="66"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="9.5" font-weight="600" fill="#6b7d8f" letter-spacing="0.07em">Find your calling. Screen out the noise.</text>
</svg>
